<!-- notes/templates/notes/add_question.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>添加错题 - 我的错题本</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 0 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; }
        .checkbox-group input { width: auto; }
        button { background-color: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #45a049; }
        .cancel { background-color: #f44336; margin-left: 10px; }
        .cancel:hover { background-color: #da190b; }
        a { color: #2196F3; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>📝 添加错题/知识点</h1>
    
    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="{{ form.title.id_for_label }}">{{ form.label_tag.title }}</label>
            {{ form.title }}
        </div>
        
        <div class="form-group">
            <label for="{{ form.content.id_for_label }}">{{ form.label_tag.content }}</label>
            {{ form.content }}
        </div>
        
        <div class="form-group">
            <label for="{{ form.tag.id_for_label }}">{{ form.label_tag.tag }}</label>
            {{ form.tag }}
        </div>
        
        <div class="form-group checkbox-group">
            {{ form.is_mastered }}
            <label for="{{ form.is_mastered.id_for_label }}">{{ form.label_tag.is_mastered }}</label>
        </div>
        
        <button type="submit"> 保存</button>
        <a href="{% url 'question_list' %}"><button type="button" class="cancel">❌ 取消</button></a>
    </form>
</body>
</html>
